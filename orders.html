<html>
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Confirmed | Amazon Clone</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>

<body>

<header>

    <div class="navbar">

        <div class="nav-logo">

            <a href="index.html">

                <img
                    src="images/logo.jpg"
                    alt="Amazon Logo"
                >

            </a>

        </div>

    </div>

</header>


<main class="success-page">

    <div class="success-box">

        <div class="success-icon">

            <i class="fa-solid fa-circle-check"></i>

        </div>

        <h1>
            Order Confirmed!
        </h1>

        <p>
            Thank you for your purchase.
        </p>

        <p>
            Your order has been received successfully.
        </p>

        <a
            href="index.html"
            class="checkout-btn"
        >
            Continue Shopping
        </a>

    </div>

</main>

</body>

</html>

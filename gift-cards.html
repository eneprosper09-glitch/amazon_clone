<html>
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gift Cards | Amazon Clone</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
    >

</head>

<body>

<header>

    <div class="navbar">

        <!-- Logo -->

        <div class="nav-logo">

            <a href="index.html">

                <img
                    src="images/logo.jpg"
                    alt="Amazon Logo"
                >

            </a>

        </div>


        <!-- Location -->

        <a
            href="delivery.html"
            class="nav-location"
        >

            <i class="fa-solid fa-location-dot"></i>

            <div>

                <small>Deliver to</small>

                <h5>Nigeria</h5>

            </div>

        </a>


        <!-- Search -->

        <div class="search">

            <select>

                <option>All</option>

            </select>

            <input
                type="text"
                id="searchInput"
                placeholder="Search Amazon"
            >

            <button
                type="button"
                id="searchBtn"
                aria-label="Search"
            >

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </div>


        <!-- Account -->

        <a
            href="account.html"
            class="account"
        >

            <small>Hello, Sign in</small>

            <h5>Account &amp; Lists</h5>

        </a>


        <!-- Returns & Orders -->

        <a
            href="orders.html"
            class="returns"
        >

            <small>Returns</small>

            <h5>&amp; Orders</h5>

        </a>


        <!-- Wishlist -->

        <a
            href="wishlist.html"
            class="wishlist-link"
        >

            <i class="fa-solid fa-heart"></i>

            <h4>
                Wishlist
                (<span id="wishlist-count">0</span>)
            </h4>

        </a>


        <!-- Cart -->

        <a
            href="cart.html"
            class="cart"
        >

            <i class="fa-solid fa-cart-shopping"></i>

            <h4>
                Cart
                (<span id="cart-count">0</span>)
            </h4>

        </a>

    </div>


    <!-- SECOND NAV -->

    <nav>

        <ul>

            <li>

                <i class="fa-solid fa-bars"></i>

                All

            </li>


            <li>

                <a href="deals.html">
                    Today's Deals
                </a>

            </li>


            <li>

                <a href="customer-service.html">
                    Customer Service
                </a>

            </li>


            <li>

                <a href="registry.html">
                    Registry
                </a>

            </li>


            <li>

                <a href="gift-cards.html">
                    Gift Cards
                </a>

            </li>


            <li>

                <a href="sell.html">
                    Sell
                </a>

            </li>

        </ul>


        <div>
            Shop Deals in Electronics
        </div>

    </nav>

</header>


<!-- ================= GIFT CARD ================= -->

<main class="gift-card-page">

    <div class="gift-card-box">

        <h1>
            Amazon Clone Gift Cards
        </h1>


        <p>
            Choose a gift card amount and send
            it to someone special.
        </p>


        <form id="giftCardForm">


            <label for="giftAmount">

                Choose an amount

            </label>


            <select
                id="giftAmount"
                required
            >

                <option value="">

                    Select amount

                </option>


                <option value="5000">

                    ₦5,000

                </option>


                <option value="10000">

                    ₦10,000

                </option>


                <option value="20000">

                    ₦20,000

                </option>


                <option value="50000">

                    ₦50,000

                </option>

            </select>


            <label for="recipientName">

                Recipient's Name

            </label>


            <input
                type="text"
                id="recipientName"
                required
            >


            <label for="recipientEmail">

                Recipient's Email

            </label>


            <input
                type="email"
                id="recipientEmail"
                required
            >


            <button
                type="submit"
                class="auth-btn"
            >

                Buy Gift Card

            </button>

        </form>

    </div>

</main>


<script src="script.js"></script>

</body>

</html>

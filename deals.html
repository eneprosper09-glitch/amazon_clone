<html>
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Today's Deals | Amazon Clone</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
    >

</head>


<body>

<header>

    <div class="navbar">

        <!-- Logo -->

        <div class="nav-logo">

            <a href="index.html">

                <img
                    src="images/logo.jpg"
                    alt="Amazon Logo"
                >

            </a>

        </div>


        <!-- Location -->

        <a
            href="delivery.html"
            class="nav-location"
        >

            <i class="fa-solid fa-location-dot"></i>

            <div>

                <small>Deliver to</small>

                <h5>Nigeria</h5>

            </div>

        </a>


        <!-- Search -->

        <div class="search">

            <select>

                <option>All</option>

            </select>


            <input
                type="text"
                id="searchInput"
                placeholder="Search Amazon"
            >


            <button
                type="button"
                id="searchBtn"
            >

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </div>


        <!-- Account -->

        <a
            href="account.html"
            class="account"
        >

            <small>Hello, Sign in</small>

            <h5>Account &amp; Lists</h5>

        </a>


        <!-- Returns -->

        <a
            href="orders.html"
            class="returns"
        >

            <small>Returns</small>

            <h5>&amp; Orders</h5>

        </a>


        <!-- Wishlist -->

        <a
            href="wishlist.html"
            class="wishlist-link"
        >

            <i class="fa-solid fa-heart"></i>

            <h4>
                Wishlist
                (<span id="wishlist-count">0</span>)
            </h4>

        </a>


        <!-- Cart -->

        <a
            href="cart.html"
            class="cart"
        >

            <i class="fa-solid fa-cart-shopping"></i>

            <h4>
                Cart
                (<span id="cart-count">0</span>)
            </h4>

        </a>

    </div>

</header>


<main class="deals-page">

    <h1>Today's Deals</h1>

    <p class="deals-intro">
        Great deals on selected products.
    </p>


    <div class="deals-grid">


        <!-- AirPods -->

        <div class="deal-card">

            <img
                src="images/product1.png"
                alt="Apple AirPods Pro"
            >

            <h2>
                Apple AirPods Pro
            </h2>

            <p class="deal-price">
                ₦189,999
            </p>

            <a
                href="airpods.html"
                class="deal-btn"
            >
                Shop Now
            </a>

        </div>


        <!-- Sony -->

        <div class="deal-card">

            <img
                src="images/project2.png"
                alt="Sony Headphones"
            >

            <h2>
                Sony Headphones
            </h2>

            <p class="deal-price">
                ₦240,999
            </p>

            <a
                href="sony-headphones.html"
                class="deal-btn"
            >
                Shop Now
            </a>

        </div>


        <!-- Extension Cable -->

        <div class="deal-card">

            <img
                src="images/project3.png"
                alt="Extension Cable"
            >

            <h2>
                Extension Cable
            </h2>

            <p class="deal-price">
                ₦22,880
            </p>

            <a
                href="extension-cable.html"
                class="deal-btn"
            >
                Shop Now
            </a>

        </div>


        <!-- Blender -->

        <div class="deal-card">

            <img
                src="images/project4.png"
                alt="Blender"
            >

            <h2>
                Blender
            </h2>

            <p class="deal-price">
                ₦99,999
            </p>

            <a
                href="blender.html"
                class="deal-btn"
            >
                Shop Now
            </a>

        </div>

    </div>

</main>


<script src="script.js"></script>

</body>

</html>

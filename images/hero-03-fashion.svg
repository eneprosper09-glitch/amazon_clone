  </defs>

  <rect width="1500" height="600" fill="url(#bg3)"/>

  <!-- soft arcs -->
  <circle cx="1250" cy="300" r="260" fill="#E9C9B6" opacity="0.6"/>
  <circle cx="1350" cy="180" r="120" fill="#DCA98C" opacity="0.5"/>

  <text x="90" y="220" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5" fill="#B5583F">NEW SEASON</text>
  <text x="90" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" fill="#3B2A26">Fashion Edit</text>
  <text x="90" y="365" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#6B4F45">Curated looks for every wardrobe</text>

  <g transform="translate(90,410)">

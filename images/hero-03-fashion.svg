<svg viewBox="0 0 1500 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7ECE1"/>
      <stop offset="100%" stop-color="#F1DACB"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C1495B"/>
      <stop offset="100%" stop-color="#E07A5F"/>

<html>
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In | Amazon Clone</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
    >

</head>

<body>

<header>

    <div class="navbar">

        <!-- Logo -->

        <div class="nav-logo">

            <a href="index.html">

                <img
                    src="images/logo.jpg"
                    alt="Amazon Logo"
                >

            </a>

        </div>


        <!-- Location -->

        <a
            href="delivery.html"
            class="nav-location"
        >

            <i class="fa-solid fa-location-dot"></i>

            <div>

                <small>Deliver to</small>

                <h5>Nigeria</h5>

            </div>

        </a>


        <!-- Search -->

        <div class="search">

            <select>
                <option>All</option>
            </select>

            <input
                type="text"
                id="searchInput"
                placeholder="Search Amazon"
            >

            <button
                type="button"
                id="searchBtn"
            >

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </div>


        <!-- Orders -->

        <a
            href="orders.html"
            class="returns"
        >

            <small>Returns</small>

            <h5>&amp; Orders</h5>

        </a>


        <!-- Wishlist -->

        <a
            href="wishlist.html"
            class="wishlist-link"
        >

            <i class="fa-solid fa-heart"></i>

            <h4>
                Wishlist
                (<span id="wishlist-count">0</span>)
            </h4>

        </a>


        <!-- Cart -->

        <a
            href="cart.html"
            class="cart"
        >

            <i class="fa-solid fa-cart-shopping"></i>

            <h4>
                Cart
                (<span id="cart-count">0</span>)
            </h4>

        </a>

    </div>

</header>


<main class="auth-page">


    <!-- SIGN IN -->

    <div class="auth-box">

        <h1>
            Sign in
        </h1>


        <form id="signInForm">

            <label for="signInEmail">
                Email or mobile phone number
            </label>

            <input
                type="text"
                id="signInEmail"
                required
            >


            <label for="signInPassword">
                Password
            </label>

            <input
                type="password"
                id="signInPassword"
                required
            >


            <button
                type="submit"
                class="auth-btn"
            >
                Sign in
            </button>


            <p class="auth-note">

                By continuing, you agree to our
                Terms and Conditions.

            </p>

        </form>

    </div>


    <!-- CREATE ACCOUNT -->

    <div class="create-account">

        <div class="divider">

            <span>
                New to Amazon Clone?
            </span>

        </div>


        <button
            type="button"
            id="showSignUp"
            class="create-account-btn"
        >

            Create your Amazon Clone account

        </button>

    </div>


    <!-- SIGN UP -->

    <div
        class="auth-box signup-box"
        id="signupBox"
    >

        <h1>
            Create account
        </h1>


        <form id="signUpForm">

            <label for="signupName">
                Your name
            </label>

            <input
                type="text"
                id="signupName"
                required
            >


            <label for="signupEmail">
                Email
            </label>

            <input
                type="email"
                id="signupEmail"
                required
            >


            <label for="signupPassword">
                Password
            </label>

            <input
                type="password"
                id="signupPassword"
                minlength="6"
                required
            >

            <small class="password-help">
                Password must be at least 6 characters.
            </small>


            <label for="signupConfirm">
                Re-enter password
            </label>

            <input
                type="password"
                id="signupConfirm"
                required
            >


            <button
                type="submit"
                class="auth-btn"
            >

                Create account

            </button>

        </form>

    </div>


</main>


<script src="script.js"></script>

</body>

</html>

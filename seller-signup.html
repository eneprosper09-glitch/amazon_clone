<html>
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Seller Registration | Amazon Clone</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="navbar">

        <div class="nav-logo">

            <a href="index.html">

                <img
                    src="images/logo.jpg"
                    alt="Amazon Logo"
                >

            </a>

        </div>

    </div>

</header>


<main class="seller-signup-page">

    <div class="seller-signup-box">

        <h1>
            Create Your Seller Account
        </h1>

        <p>
            Enter your information to start
            selling on Amazon Clone.
        </p>


        <form id="sellerSignupForm">

            <label for="sellerName">
                Full Name
            </label>

            <input
                type="text"
                id="sellerName"
                required
            >


            <label for="sellerEmail">
                Email Address
            </label>

            <input
                type="email"
                id="sellerEmail"
                required
            >


            <label for="sellerPhone">
                Phone Number
            </label>

            <input
                type="tel"
                id="sellerPhone"
                required
            >


            <label for="businessName">
                Business Name
            </label>

            <input
                type="text"
                id="businessName"
                required
            >


            <button
                type="submit"
                class="auth-btn"
            >
                Create Seller Account
            </button>

        </form>

    </div>

</main>


<script src="script.js"></script>

</body>

</html>
